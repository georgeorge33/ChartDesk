name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Chartdesk.app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # A candidate -- v1.0.0-rc.1 -- is published as a pre-release, so the API's
          # "latest" keeps pointing at the last final one and neither ./update.sh nor the
          # in-app check offers it to anybody who did not ask for it. Its notes come from the
          # version it is a candidate for, since an RC's changes are that release's changes.
          BASE="${VERSION%%-*}"
          if [ "$BASE" != "$VERSION" ]; then
            echo "prerelease=yes" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=no" >> "$GITHUB_OUTPUT"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" Resources/Info.plist
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" Resources/Info.plist

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package
        run: ditto -c -k --keepParent build/Chartdesk.app Chartdesk.app.zip

      # Pull this version's section out of CHANGELOG.md so the release notes spell the
      # changes out in full, rather than linking to a compare view.
      - name: Release notes
        id: notes
        run: |
          extract() {
            awk -v want="## $1" '
              $0 == want { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          }

          # A candidate's notes should be what that candidate adds, so its own section wins
          # when there is one. Without it every candidate carried the whole release's
          # changelog, which buries the one thing a tester needs to look at. A final release
          # has no suffix, so it takes the release section as before.
          extract "${{ steps.version.outputs.version }}" > notes.md
          if [ ! -s notes.md ]; then
            extract "${{ steps.version.outputs.base }}" > notes.md
          fi
          if [ -s notes.md ]; then
            echo "have_notes=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No '## ${VERSION}' section in CHANGELOG.md; falling back to generated notes."
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.notes.outputs.have_notes }}" = "yes" ]; then
            NOTES=(--notes-file notes.md)
          else
            NOTES=(--generate-notes)
          fi

          FLAGS=()
          if [ "${{ steps.version.outputs.prerelease }}" = "yes" ]; then
            FLAGS+=(--prerelease)
          fi

          if gh release create "${{ steps.version.outputs.tag }}" Chartdesk.app.zip \
               --title "Chartdesk ${{ steps.version.outputs.version }}" \
               "${FLAGS[@]}" "${NOTES[@]}"; then
            exit 0
          fi

          # The release already exists: refresh both the asset and the notes.
          gh release upload "${{ steps.version.outputs.tag }}" Chartdesk.app.zip --clobber
          if [ "${{ steps.notes.outputs.have_notes }}" = "yes" ]; then
            gh release edit "${{ steps.version.outputs.tag }}" --notes-file notes.md
          fi
